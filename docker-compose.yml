# Day 1: API service only.
#
# Coming in later weeks (left as comments so the file documents the plan,
# not just the current state):
#   - chroma: vector DB for retrieval (Week 2)
#   - prometheus + grafana: monitoring stack (Week 3)

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
      - ./configs:/code/configs
    environment:
      - ENV=development

