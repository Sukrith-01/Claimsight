# ClaimSight full stack: API + monitoring.
#
# `docker compose up --build` starts everything.
# API at http://localhost:8000, Prometheus at http://localhost:9090,
# Grafana at http://localhost:3000 (admin/admin on first login,
# add Prometheus as a data source at http://prometheus:9090).

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
      - ./configs:/code/configs
    environment:
      - ENV=development

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana_dashboard.json:/etc/grafana/provisioning/dashboards/claimsight.json
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      - prometheus
