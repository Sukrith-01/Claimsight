# Day 1: API service only.
#
# Note on Chroma: ChromaDB runs IN-PROCESS (embedded client, no separate
# service) as of Day 6 - that's why there's no `chroma` service below.
# A standalone Chroma server (the commented block) would only be needed
# for a multi-instance deployment sharing one index, which isn't the
# case yet.
#
# Coming in later weeks:
#   - prometheus + grafana: monitoring stack (Week 3)

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
      - ./configs:/code/configs
    environment:
      - ENV=development

  # Standalone Chroma server - only needed if/when multiple API instances
  # need to share one persistent index rather than each running its own
  # in-process store.
