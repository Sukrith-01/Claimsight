name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pytesseract is just a Python wrapper - the actual OCR engine has
      # to be installed separately on whatever machine runs the tests.
      # Missing on Day 1's version of this workflow; added Day 4 after
      # CI failed while local tests passed. See MISTAKES.md.
      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v

